<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8fc">
  <meta name="description" content="Organiza tus clases, anota lo que aprendes y planifica lo que necesitas repasar.">
  <title>FocusKit — Mi día de clase</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8fc;
      --card: #fff;
      --text: #49394e;
      --muted: #806f85;
      --primary: #88539c;
      --soft: #f4e8f6;
      --border: #e6d7e9;
      --field: #fffafd;
      --danger: #a83e62;
      --shadow: 0 12px 32px rgb(73 57 78 / 6%);
    }

    body.dark {
      color-scheme: dark;
      --bg: #211d29;
      --card: #302738;
      --text: #f5eaf8;
      --muted: #c3b4c7;
      --primary: #d3a9e8;
      --soft: #44364d;
      --border: #594a61;
      --field: #392f40;
      --danger: #f0a2b9;
      --shadow: 0 12px 32px rgb(0 0 0 / 14%);
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      transition: background-color .2s, color .2s;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }
    .container { width: min(100% - 32px, 760px); margin: 32px auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 32px; }
    .logo { color: var(--primary); font-size: 1.8rem; font-weight: 800; letter-spacing: -.04em; }
    .subtitle { color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .18em; }
    .theme-button, .delete-button, .add-button {
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 700;
      transition: transform .15s, background-color .15s;
    }
    .theme-button { padding: 10px 14px; background: var(--soft); color: var(--text); white-space: nowrap; }
    button:hover { transform: translateY(-1px); }
    h1 { margin: 0 0 6px; font-size: clamp(1.7rem, 5vw, 2rem); line-height: 1.2; }
    h2 { margin: 0; font-size: 1.2rem; }
    .description { margin: 0; color: var(--muted); }
    .date-box { margin: 26px 0; padding: 17px; border-radius: 15px; background: var(--soft); }
    .date-box label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .08em; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
    }
    textarea { min-height: 88px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
    .section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 26px 0 15px; }
    #classCount { color: var(--muted); font-size: .9rem; }
    .class-card { margin-bottom: 16px; padding: 20px; border: 1px solid var(--border); border-radius: 17px; background: var(--card); box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .card-actions { display: flex; align-items: center; gap: 8px; }
    .class-number { display: inline-grid; min-width: 38px; min-height: 36px; place-items: center; border-radius: 9px; background: var(--soft); color: var(--primary); font-weight: 800; }
    .delete-button { min-width: 36px; min-height: 36px; padding: 6px 9px; border-color: transparent; background: transparent; color: var(--danger); }
    .field { margin-bottom: 17px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 700; }
    .review-title { margin: 20px 0; color: var(--primary); font-weight: 700; }
    .add-button { width: 100%; padding: 15px; border: 1px dashed var(--primary); background: var(--soft); color: var(--primary); }
    .empty-state { margin: 0 0 16px; padding: 22px; border: 1px dashed var(--border); border-radius: 14px; color: var(--muted); text-align: center; }
    .save-status { min-height: 1.5em; margin: 12px 0 0; color: var(--muted); font-size: .8rem; text-align: right; }
    footer { margin-top: 35px; color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-align: center; }
    @media (max-width: 500px) {
      .container { width: min(100% - 24px, 760px); margin: 18px auto; }
      header { align-items: flex-start; margin-bottom: 26px; }
      .theme-button { padding: 9px 10px; font-size: .82rem; }
      .class-card { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <div class="logo">FocusKit</div>
        <div class="subtitle">ESTUDIA A TU MANERA</div>
      </div>
      <button class="theme-button" id="themeButton" type="button" aria-pressed="false">🌙 Modo oscuro</button>
    </header>

    <section aria-labelledby="pageTitle">
      <h1 id="pageTitle">Mi día de clase</h1>
      <p class="description">Organiza lo que aprendes cada día.</p>

      <div class="date-box">
        <label for="dayDate">FECHA</label>
        <input type="date" id="dayDate">
      </div>

      <div class="section-title">
        <h2>Mis clases</h2>
        <span id="classCount" aria-live="polite">0 clases</span>
      </div>
      <div id="classes" aria-live="polite"></div>
      <button class="add-button" id="addButton" type="button">＋ Añadir otra clase</button>
      <p class="save-status" id="saveStatus" role="status" aria-live="polite"></p>
    </section>

    <footer>FOCUSKIT · ORGANIZA · APRENDE · MEJORA</footer>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "focuskit_data_v2";
      const LEGACY_STORAGE_KEY = "focuskit_data_v1";
      const classesContainer = document.getElementById("classes");
      const addButton = document.getElementById("addButton");
      const dateInput = document.getElementById("dayDate");
      const themeButton = document.getElementById("themeButton");
      const countLabel = document.getElementById("classCount");
      const saveStatus = document.getElementById("saveStatus");

      const today = toLocalISODate(new Date());
      let selectedDate = today;
      let darkMode = false;
      let days = {};
      let saveTimer;

      function toLocalISODate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function newId() {
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
          return globalThis.crypto.randomUUID();
        }
        return `class-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function createClass() {
        return { id: newId(), subject: "", content: "", learned: "", review: "" };
      }

      function isValidClass(item) {
        return item && typeof item.id === "string" &&
          ["subject", "content", "learned", "review"].every(key => typeof item[key] === "string");
      }

      function loadData() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (saved && typeof saved === "object") {
            if (saved.days && typeof saved.days === "object" && !Array.isArray(saved.days)) {
              for (const [date, items] of Object.entries(saved.days)) {
                if (/^\d{4}-\d{2}-\d{2}$/.test(date) && Array.isArray(items)) {
                  days[date] = items.filter(isValidClass);
                }
              }
            }
            if (typeof saved.selectedDate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(saved.selectedDate)) {
              selectedDate = saved.selectedDate;
            }
            darkMode = saved.darkMode === true;
            return;
          }

          // Migrate data from the first version without losing existing notes.
          const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "null");
          if (legacy && Array.isArray(legacy.classes)) {
            const legacyDate = typeof legacy.selectedDate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(legacy.selectedDate)
              ? legacy.selectedDate : today;
            days[legacyDate] = legacy.classes.filter(isValidClass);
            selectedDate = legacyDate;
            darkMode = legacy.darkMode === true;
          }
        } catch (error) {
          console.warn("No se pudieron cargar los datos guardados.", error);
          saveStatus.textContent = "No se pudieron leer los datos guardados.";
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ days, selectedDate, darkMode }));
          saveStatus.textContent = "Guardado en este dispositivo";
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => { saveStatus.textContent = ""; }, 2200);
        } catch (error) {
          console.warn("No se pudieron guardar los datos.", error);
          saveStatus.textContent = "No se pudo guardar. Comprueba el espacio del navegador.";
        }
      }

      function makeField({ label, value, field, multiline, placeholder, id }) {
        const wrapper = document.createElement("div");
        wrapper.className = "field";
        const labelElement = document.createElement("label");
        labelElement.htmlFor = id;
        labelElement.textContent = label;
        const control = document.createElement(multiline ? "textarea" : "input");
        control.id = id;
        control.dataset.field = field;
        control.placeholder = placeholder;
        control.value = value;
        wrapper.append(labelElement, control);
        return wrapper;
      }

      function renderClasses() {
        const items = days[selectedDate] || [];
        classesContainer.replaceChildren();
        countLabel.textContent = `${items.length} ${items.length === 1 ? "clase" : "clases"}`;

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "Todavía no has añadido clases para este día.";
          classesContainer.append(empty);
        }

        items.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "class-card";
          card.dataset.id = item.id;

          const header = document.createElement("div");
          header.className = "card-header";
          const title = document.createElement("strong");
          title.textContent = item.subject.trim() || "Nueva clase";
          title.className = "card-title";
          const actions = document.createElement("div");
          actions.className = "card-actions";
          const number = document.createElement("span");
          number.className = "class-number";
          number.textContent = String(index + 1).padStart(2, "0");
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-button";
          remove.dataset.delete = item.id;
          remove.setAttribute("aria-label", `Eliminar clase ${index + 1}`);
          remove.textContent = "✕";
          actions.append(number, remove);
          header.append(title, actions);

          const prefix = `class-${item.id}`;
          card.append(
            header,
            makeField({ label: "Asignatura", value: item.subject, field: "subject", placeholder: "Ej. Matemáticas", id: `${prefix}-subject` }),
            makeField({ label: "Contenido trabajado", value: item.content, field: "content", placeholder: "¿Qué habéis dado?", id: `${prefix}-content` })
          );
          const reviewTitle = document.createElement("div");
          reviewTitle.className = "review-title";
          reviewTitle.textContent = "✨ Mini repaso";
          card.append(
            reviewTitle,
            makeField({ label: "1. ¿Qué he aprendido en esta clase?", value: item.learned, field: "learned", multiline: true, placeholder: "Escribe lo que has aprendido...", id: `${prefix}-learned` }),
            makeField({ label: "2. ¿Qué necesito repasar o mejorar?", value: item.review, field: "review", multiline: true, placeholder: "Anota lo que necesitas practicar...", id: `${prefix}-review` })
          );
          classesContainer.append(card);
        });
      }

      function updateTheme() {
        document.body.classList.toggle("dark", darkMode);
        themeButton.textContent = darkMode ? "☀️ Modo claro" : "🌙 Modo oscuro";
        themeButton.setAttribute("aria-pressed", String(darkMode));
        document.querySelector('meta[name="theme-color"]').content = darkMode ? "#211d29" : "#fff8fc";
      }

      addButton.addEventListener("click", () => {
        if (!days[selectedDate]) days[selectedDate] = [];
        days[selectedDate].push(createClass());
        renderClasses();
        saveData();
        const firstField = classesContainer.querySelector("input");
        if (firstField) firstField.focus();
      });

      classesContainer.addEventListener("input", event => {
        const field = event.target.dataset.field;
        const card = event.target.closest(".class-card");
        if (!field || !card) return;
        const item = (days[selectedDate] || []).find(entry => entry.id === card.dataset.id);
        if (!item) return;
        item[field] = event.target.value;
        if (field === "subject") card.querySelector(".card-title").textContent = event.target.value.trim() || "Nueva clase";
        saveData();
      });

      classesContainer.addEventListener("click", event => {
        const button = event.target.closest("[data-delete]");
        if (!button) return;
        days[selectedDate] = (days[selectedDate] || []).filter(item => item.id !== button.dataset.delete);
        renderClasses();
        saveData();
      });

      dateInput.addEventListener("change", () => {
        selectedDate = dateInput.value || today;
        if (!days[selectedDate]) days[selectedDate] = [];
        renderClasses();
        saveData();
      });

      themeButton.addEventListener("click", () => {
        darkMode = !darkMode;
        updateTheme();
        saveData();
      });

      loadData();
      if (!days[selectedDate]) days[selectedDate] = [];
      dateInput.value = selectedDate;
      updateTheme();
      renderClasses();
      saveData();
    })();
  </script>
</body>
</html>
